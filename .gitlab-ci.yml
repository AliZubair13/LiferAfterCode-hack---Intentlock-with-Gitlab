stages:
  - test
  - drift          # IntentLock gates: merge request pipelines only
  - package
  - deploy_staging # stub until Google Cloud step
  - verify_staging # stub: acceptance-criteria checks
  - release

# --- GitLab security scanners (secure stage) ---
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml

variables:
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  # Container scanning scans the image built in the package stage.
  CS_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

# Scanner jobs run in the test stage; container scanning must wait for the image.
sast:
  stage: test
secret_detection:
  stage: test
dependency_scanning:
  stage: test
container_scanning:
  stage: package
  needs: ["build-image"]

# Unit tests run in branch pipelines AND merge request pipelines.
unit-tests:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - python -m pytest -v --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# IntentLock gates: injection screen -> contract validation -> drift check.
# Fails CLOSED: a missing token, issue or contract blocks the merge request.
# Needs a masked, UNPROTECTED CI variable INTENTLOCK_TOKEN (project access
# token, scope api). Agent branches are unprotected, so a protected variable
# would not be visible to this job.
drift-check:
  stage: drift
  image: python:3.12            # full image: includes git
  variables:
    GIT_DEPTH: "0"              # full history so the base commit is available
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - python -m ci.run_gates --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
  artifacts:
    when: always
    paths:
      - gates_report.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build-image:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --build-arg APP_VERSION=$CI_COMMIT_SHORT_SHA -t "$IMAGE" .
    - docker push "$IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-staging:
  stage: deploy_staging
  script:
    - echo "STUB - Cloud Run staging deploy (Monday)"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

verify-staging:
  stage: verify_staging
  script:
    - echo "STUB - ci/verify.py runs acceptance criteria against the staging URL"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Posts the evidence receipt on the original issue. Skips quietly (exit 0)
# when the token is missing or the commit does not reference an issue.
evidence-receipt:
  stage: release
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - python -m ci.receipt
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# GitLab Release for every pipeline on the default branch.
# allow_failure until we have confirmed the job token may create tags here.
create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release v$CI_PIPELINE_IID"
  release:
    tag_name: "v$CI_PIPELINE_IID"
    description: "Automated release from pipeline $CI_PIPELINE_ID (commit $CI_COMMIT_SHORT_SHA)"
    ref: $CI_COMMIT_SHA
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
